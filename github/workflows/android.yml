
name: Сборка Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Установить Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Распаковать проект
        run: |
          unzip -q HeatFurnaceControl-AndroidStudio.zip

      - name: Установить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Собрать APK
        run: gradle -p HeatFurnaceControl assembleDebug

      - name: Сохранить APK
        uses: actions/upload-artifact@v4
        with:
          name: HeatFurnaceControl-APK
          path: HeatFurnaceControl/app/build/outputs/apk/debug/app-debug.apk
